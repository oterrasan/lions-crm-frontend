<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIONS CRM - Produtos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        
        .header {
            background: #0A2540;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #D4AF37;
            cursor: pointer;
        }
        
        .date {
            font-size: 13px;
            color: #ccc;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 13px;
        }
        
        .user-info {
            text-align: right;
        }
        
        .user-name {
            font-weight: bold;
            color: #D4AF37;
        }
        
        .header-links a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }
        
        .header-links a:hover {
            color: #D4AF37;
        }
        
        .main-container {
            display: flex;
            min-height: calc(100vh - 60px);
        }
        
        .sidebar {
            width: 200px;
            background: #1a1a1a;
            color: white;
            padding: 0;
        }
        
        .menu-title {
            background: #0A2540;
            padding: 15px 20px;
            font-weight: bold;
            color: #D4AF37;
        }
        
        .menu-item {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid #333;
            transition: all 0.3s;
        }
        
        .menu-item:hover {
            background: #D4AF37;
            color: #000;
        }
        
        .menu-item.active {
            background: #D4AF37;
            color: #000;
            font-weight: bold;
        }
        
        .content {
            flex: 1;
            padding: 30px;
        }
        
        .page-title {
            font-size: 24px;
            color: #0A2540;
            margin-bottom: 30px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #0A2540;
            color: white;
            margin-bottom: 20px;
        }
        
        .btn-primary:hover {
            background: #D4AF37;
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .product-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        
        .product-name {
            font-size: 18px;
            font-weight: bold;
            color: #0A2540;
        }
        
        .product-status {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .status-ativo {
            background: #10B981;
            color: white;
        }
        
        .status-inativo {
            background: #6B7280;
            color: white;
        }
        
        .product-category {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .product-description {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        
        .product-footer {
            display: flex;
            gap: 10px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        
        .product-btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .btn-edit {
            background: #D4AF37;
            color: white;
        }
        
        .btn-edit:hover {
            background: #0A2540;
        }
        
        .btn-toggle {
            background: #666;
            color: white;
        }
        
        .btn-toggle:hover {
            background: #888;
        }
        
        .footer {
            background: #1a1a1a;
            color: #999;
            text-align: center;
            padding: 15px;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="logo" onclick="window.location.href='dashboard.html'">LIONS CRM</div>
            <div class="date" id="currentDate"></div>
        </div>
        
        <div class="header-right">
            <div class="user-info">
                <div class="user-name">Roberto Terrasan</div>
                <div>Lions Corretora</div>
            </div>
            <div class="header-links">
                <a href="#" onclick="alert('Funcionalidade em desenvolvimento'); return false;">Alterar Senha</a>
                <a href="#" onclick="logout()">Sair</a>
            </div>
        </div>
    </div>
    
    <div class="main-container">
        <div class="sidebar">
            <div class="menu-title">Menu</div>
            <div class="menu-item" onclick="window.location.href='dashboard.html'">Dashboard</div>
            <div class="menu-item" onclick="window.location.href='clientes-lista.html'">Clientes</div>
            <div class="menu-item" onclick="alert('Em desenvolvimento')">Contatos</div>
            <div class="menu-item active">Produtos</div>
            <div class="menu-item" onclick="window.location.href='propostas.html'">Propostas</div>
            <div class="menu-item" onclick="window.location.href='agenda.html'">Agenda</div>
            <div class="menu-item" onclick="alert('Em desenvolvimento')">Relatórios</div>
            <div class="menu-item" onclick="alert('Em desenvolvimento')">Configurações</div>
        </div>
        
        <div class="content">
            <h1 class="page-title">Linhas de Produtos</h1>
            
            <button class="btn btn-primary" onclick="alert('Novo produto em desenvolvimento')">+ Novo Produto</button>
            
            <div class="products-grid" id="productsGrid">
                <!-- Produtos serão inseridos aqui -->
            </div>
        </div>
    </div>
    
    <div class="footer">
        LIONS CRM v1.0 © 2025 - Roberto Terrasan - Lions Corretora - Suporte: contato@oterrasan.com.br
    </div>
    
    <script>
        const produtos = [
            {
                id: 1,
                nome: 'Dominion VidaPrev',
                categoria: 'Previdência Internacional',
                descricao: 'Aposentadoria internacional com parceria BNY Mellon. Renda em dólar e diversificação global.',
                status: 'ativo'
            },
            {
                id: 2,
                nome: 'MetLife Seguro de Vida',
                categoria: 'Seguro de Vida',
                descricao: 'Proteção completa para você e sua família. Cobertura abrangente e valores competitivos.',
                status: 'ativo'
            },
            {
                id: 3,
                nome: 'Azos Seguro Empresarial',
                categoria: 'Seguro Empresarial',
                descricao: 'Proteção completa para sua empresa. Responsabilidade civil, danos e continuidade do negócio.',
                status: 'ativo'
            },
            {
                id: 4,
                nome: 'Omint Plano de Saúde',
                categoria: 'Plano de Saúde',
                descricao: 'Plano de saúde premium com cobertura nacional e internacional. Rede credenciada de excelência.',
                status: 'ativo'
            },
            {
                id: 5,
                nome: 'ANADEM Proteção Jurídica',
                categoria: 'Proteção Jurídica',
                descricao: 'Proteção jurídica especializada para médicos. 26 anos blindando profissionais contra processos.',
                status: 'ativo'
            },
            {
                id: 6,
                nome: 'DIT - Diária por Incapacidade',
                categoria: 'Seguro Renda',
                descricao: 'Garante sua renda em caso de incapacidade temporária. Essencial para profissionais liberais e empresários.',
                status: 'ativo'
            },
            {
                id: 7,
                nome: 'Seguro Residencial',
                categoria: 'Seguro Residencial',
                descricao: 'Proteção completa para seu lar. Cobertura contra incêndio, roubo, danos elétricos e muito mais.',
                status: 'ativo'
            },
            {
                id: 8,
                nome: 'Seguro Auto',
                categoria: 'Seguro Automotivo',
                descricao: 'Proteção completa para seu veículo. Cobertura total com assistência 24h.',
                status: 'ativo'
            },
            {
                id: 9,
                nome: 'Consórcio Imobiliário',
                categoria: 'Consórcio',
                descricao: 'Realize o sonho da casa própria de forma planejada e sem juros.',
                status: 'ativo'
            },
            {
                id: 10,
                nome: 'Plano Odontológico',
                categoria: 'Plano Odontológico',
                descricao: 'Cuidados dentários completos para você e sua família. Rede credenciada em todo Brasil.',
                status: 'ativo'
            }
        ];
        
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            produtos.forEach(produto => {
                const statusClass = 'status-' + produto.status;
                const statusText = produto.status === 'ativo' ? 'Ativo' : 'Inativo';
                
                const card = `
                    <div class="product-card">
                        <div class="product-header">
                            <div class="product-name">${produto.nome}</div>
                            <div class="product-status ${statusClass}">${statusText}</div>
                        </div>
                        <div class="product-category">${produto.categoria}</div>
                        <div class="product-description">${produto.descricao}</div>
                        <div class="product-footer">
                            <button class="product-btn btn-edit" onclick="alert('Editar produto #${produto.id}')">Editar</button>
                            <button class="product-btn btn-toggle" onclick="alert('Desativar/Ativar produto')">Desativar</button>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }
        
        function updateDate() {
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            };
            const date = new Date().toLocaleDateString('pt-BR', options);
            document.getElementById('currentDate').textContent = date;
        }
        
        if (!localStorage.getItem('lions_user')) {
            window.location.href = 'login.html';
        }
        
        function logout() {
            if (confirm('Deseja realmente sair?')) {
                localStorage.removeItem('lions_user');
                window.location.href = 'login.html';
            }
        }
        
        updateDate();
        renderProducts();
    </script>
</body>
</html>
